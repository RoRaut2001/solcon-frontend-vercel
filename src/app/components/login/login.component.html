<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
  <!-- Left Section -->
  <div class="left-section col-md-6">
    <img src="assets/images/solcon_logo.png" alt="Logo" class="logo" />
    <button class="tagline"># No.1 Platform</button>
    <h1>SHAPING THE FUTURE OF <br>DEEP TECH INVESTMENTS</h1>
    <p>
      Solcon’s deep tech strategy is guided by the firm’s vision to<br>
      deliver great returns to investors on a long-term basis.
    </p>
    <div class="stats d-flex">
      <div>
        <span>20</span>
        <p>Years Experience</p>
      </div>
      <div class="separator mx-2"></div>
      <div>
        <span>15</span>
        <p>Our Team</p>
      </div>
      <div class="separator mx-2"></div>
      <div>
        <span>19</span>
        <p>Locations</p>
      </div>
    </div>
    <button class="visit-site btn btn-outline-light mt-3" (click)="visitSite()">Visit Site →</button>
  </div>

  <!-- Right Section -->
  <div class="right-section col-md-4">
    <h2 class="text-center">Login Here</h2>
    <form [formGroup]="loginForm">
      <label class="label" for="username">Username</label>
      <div class="input-group">
        <span class="icon">
          <img src="assets/svg/user.svg" alt="User Icon" height="25" width="25"/>
        </span>
        <input type="text" id="username" formControlName="username" class="form-control bg-transparent text-white" placeholder="user@gmail.com" />
      </div>

      <label class="label" for="password">Password</label>
      <div class="input-group">
        <span class="icon">
          <img src="assets/svg/password.svg" alt="Lock Icon" height="25" width="25"/>
        </span>
        <input type="password" id="password" formControlName="password" class="form-control bg-transparent text-white" placeholder="•••••" />
      </div>

      <button [disabled]="isLoading" (click)="onLogin()" class="login-btn btn btn-light w-100">
        Click to Login
        <div *ngIf="isLoading" class="spinner"></div>
      </button>
    </form>
  </div>
</div>
</body>
</html>

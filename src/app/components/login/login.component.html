<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
<div class="container">
  <!-- Left Section -->
  <div class="left-section">
    <img src="/assets/images/solcon_logo.png" alt="Logo" class="logo" />
    <button class="tagline"># No.1 Platform</button>
    <h1>SHAPING THE FUTURE OF <br>DEEP TECH INVESTMENTS</h1>
    <p>
      Solcon’s deep tech strategy is guided by the firms’ vision to<br>deliver great returns to investors on a long-term basis
    </p>
    <div class="stats">
      <div>
        <span>20</span>
        <p>Years Experience</p>
      </div>
      <div class="separator"></div>
      <div>
        <span>15</span>
        <p>Our team</p>
      </div>
      <div class="separator"></div>
      <div>
        <span>19</span>
        <p>Locations</p>
      </div>
    </div>
    <button class="visit-site">
      Visit Site →
    </button>
  </div>

  <!-- Right Section -->
  <div class="right-section">
    <h2>Login Here</h2>
    <form>
      <label class="label" for="username">Username</label>
      <div class="input-group">
          <span class="icon">
            <img ngSrc="assets/svg/user.svg" alt="User Icon" height="31" width="31"/>
          </span>
        <div class="separator"></div>
        <input type="email" id="username" placeholder="user@gmail.com" />
      </div>
      <label class="label" for="password">Password</label>
      <div class="input-group">
        <span class="icon">
          <img ngSrc="assets/svg/password.svg" alt="Lock Icon" height="31" width="31"/>
        </span>
        <div class="separator"></div>
        <input type="password" id="password" placeholder="•••••" />
      </div>
      <button type="submit" class="login-btn">
        Click to Login
      </button>
    </form>
  </div>
</div>

</body>
</html>

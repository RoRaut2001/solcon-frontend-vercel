<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company List</title>
  <link rel="stylesheet" href="company-list.component.css">
</head>
<body>
<div class="heading">
  COMPANY LIST
  <button class="logout-btn" (click)="logout()">
    Logout <mat-icon>logout</mat-icon>
  </button>
</div>
<p class="company-name">Home | Company Lists | {{ selectedCompany().companyName }}</p>
<div class="divider-line"></div>

<form [formGroup]="companyForm">
  <div class="filter-container">
    <div class="dropdowns">

      <div class="dropdown-group">
        <label for="year">Year</label>
        <select id="year" class="dropdown" formControlName="year">
          <option value="" disabled selected>Select</option>
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>

      <div class="dropdown-group">
        <label for="quarter">Quarter</label>
        <select id="quarter" class="dropdown" formControlName="quarter">
          <option value="" disabled selected>Select</option>
          <option *ngFor="let q of quarters" [value]="q">{{ q }}</option>
        </select>
      </div>

      <div class="dropdown-group">
        <label for="month">Month</label>
        <select id="month" class="dropdown" formControlName="month">
          <option value="" disabled selected>Select</option>
          <option *ngFor="let month of months" [value]="month">{{ month }}</option>
        </select>
      </div>
      <div class="dropdown-group">
        <label for="fileInput">Select File</label>
        <button type="button" class="file-select-btn" (click)="openFileDialog()">
          {{ selectedFileName || 'Select File' }}
        </button>
        <input type="file" id="fileInput" (change)="onFileSelected($event)" hidden />
      </div>
    </div>

    <div class="button-row">
      <button class="upload-btn" type="button" (click)="uploadFile()" [disabled]="isUploading">
        {{ isUploading ? 'Uploading...' : 'Upload' }}
      </button>
      <button class="clear-btn" type="button" (click)="clearFilters()">Clear</button>
    </div>
  </div>
</form>

<!-- New section for the JSON data table -->
<div *ngIf="showTable" class="table-section">
  <div class="table-header">
    <h3>Extracted Data</h3>
    <button [disabled]="isLoading" class="upload-btn" (click)="saveTableData()">
      Save Changes
      <div *ngIf="isLoading" class="spinner"></div>
    </button>
  </div>

  <div class="table-name">
    <h2>Commercial & Budget</h2>
  <app-data-table
    [jsonData]="commercialAndBusiness"
    (dataChanged)="handleDataChange($event)">
  </app-data-table>
  </div>

  <div class="table-name">
    <h2>Finance</h2>
    <app-data-table
    [jsonData]="finance"
    (dataChanged)="handleDataChange($event)">
  </app-data-table>
  </div>

<div class="table-name">
  <h2>Technology</h2>
  <app-data-table
    [jsonData]="technology"
    (dataChanged)="handleDataChange($event)">
  </app-data-table>
</div>

  <!-- <div class="table-name">
    <h2>
      Technology
    </h2>
  <app-data-table
    [jsonData]="technology"
    (dataChanged)="handleDataChange($event)">
  </app-data-table>
  </div> -->
</div>
</body>
<div *ngIf="isUploading" class="loading-overlay">
  <div class="loading-message">
    <p>{{ currentLoadingMessage }}</p>
  </div>
</div>

</html>

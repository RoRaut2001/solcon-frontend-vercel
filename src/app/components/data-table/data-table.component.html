<div class="table-container">
  <div *ngIf="!jsonData || jsonData.length === 0" class="no-data">
    No data available
  </div>

  <div *ngIf="jsonData && jsonData.length > 0">
    <!-- Mobile View (Card-based layout) -->
    <div class="mobile-cards">
      <div *ngFor="let row of jsonData; let i = index" class="data-card">

        <div class="card-content">
          <div *ngFor="let col of columns" class="card-field">
            <div class="field-label">{{col}}:</div>
            <span *ngIf="!isEditable">{{ jsonData[0][col] ?? 'NA' }}</span>
            <input *ngIf="isEditable"
                   type="text"
                   [(ngModel)]="editValues[col]"
                   class="edit-input" />
          </div>
        </div>
      </div>
    </div>

    <!-- Desktop View (Table-based layout) -->
    <table class="json-table">
      <thead>
      <tr>
        <th *ngFor="let col of columns">{{ formatTableHeader(col) }}</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td *ngFor="let col of columns">
          <span *ngIf="!isEditable">{{ jsonData[0][col] ?? 'NA' }}</span>
          <input *ngIf="isEditable"
                 type="text"
                 [(ngModel)]="editValues[col]"
                 class="edit-input" />
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="table-footer">
  <button *ngIf="!isEditable" class="edit-btn" (click)="toggleEdit()">Edit</button>
  <div *ngIf="isEditable" class="edit-actions">
    <button class="save-btn" (click)="save()">Save</button>
    <button class="edit-btn" (click)="toggleEdit()">Cancel</button>
  </div>
</div>
